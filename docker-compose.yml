services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?define MYSQL_ROOT_PASSWORD en .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-InnovartDigital}
      MYSQL_USER: ${MYSQL_USER:-innovart}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-innovart}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-InnovartDigital}
      MYSQL_USER: ${MYSQL_USER:-innovart}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-innovart}
      MYSQL_CHARSET: utf8mb4
      FLASK_DEBUG: ${FLASK_DEBUG:-0}
      PORT: 5000
    ports:
      - "${PORT:-5000}:5000"

volumes:
  mysql_data:
    driver: local
